[package]
name = "omnisia"
version = "0.1.0"
edition = "2021"
default-run = "omnisia"

[dependencies]
wgpu = "24"
winit = { version = "0.30", features = ["rwh_06"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.18", features = ["derive"] }
crossbeam = "0.8"
crossbeam-channel = "0.5"
rayon = "1.10"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
env_logger = "0.11"
log = "0.4"
zstd = "0.13"
toml = "0.8"
semver = "1.0"

[[bin]]
name = "omnisia"
path = "src/main.rs"

[[bin]]
name = "benchmarks"
path = "src/bin/benchmarks.rs"
